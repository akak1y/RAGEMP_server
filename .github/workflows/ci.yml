name: CI

on:
  push:
    branches: [master]

jobs:
  syntax-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Синтаксическая проверка бэкенда
        run: |
          for f in $(find packages/main -name '*.js'); do
            node --check "$f" || exit 1
          done
          echo "OK"

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Зависимости корня
        run: npm ci
      - name: Зависимости пакета
        run: npm ci
        working-directory: packages/main
      - name: Запуск Jest-тестов
        run: npm test
        working-directory: packages/main