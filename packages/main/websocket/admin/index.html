<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Админка RAGE MP</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <div v-if="!token">
    <h2>Вход</h2>
    <input v-model="login" placeholder="логин">
    <input v-model="password" type="password" placeholder="пароль">
    <button @click="doLogin">Войти</button>
    <p v-if="error" style="color:#f66">{{error}}</p>
  </div>

  <div v-else>
    <h2>
      Онлайн: {{online}}
      <span v-if="actionResult"
            class="action-msg"
            :class="actionResult.success ? 'ok' : 'fail'">
        {{actionResult.message}}
      </span>
    </h2>
    <div>
      <button v-for="t in tabs" :key="t" :class="{active: active===t}" @click="openTab(t)">{{t}}</button>
    </div>

    <div v-show="active==='map'" class="map-wrap">
      <div id="map" style="height:520px;margin-top:10px"></div>
      <div class="map-btns">
        <button @click="zoomIn">+</button>
        <button @click="zoomOut">−</button>
      </div>
    </div>

    <table v-if="active!=='map' && rows.length">
      <tr>
        <th v-for="c in columns" :key="c">{{c}}</th>
        <th v-if="active==='accounts' || active==='vehicles'">Действия</th>
      </tr>
      <tr v-for="r in rows" :key="r.id">
        <td v-for="c in columns" :key="c"
            :class="{editable: isEditable(c)}"
            @click="startEdit(r,c)">
          <input v-if="editing && editing.id===r.id && editing.field===c"
                 ref="editInput" v-model="editValue"
                 @keyup.enter="commitEdit" @blur="commitEdit" @keyup.esc="editing=null">
          <span v-else>{{cell(r, c)}}</span>
        </td>
        <td v-if="active==='accounts'">
          <button @click="playerAction('heal', r.id)" class="btn-heal">Heal</button>
          <button @click="playerAction('kill', r.id)" class="btn-kill">Kill</button>
          <button @click="playerAction('delete', r.id)" class="btn-delete">Delete</button>
        </td>
        <td v-if="active==='vehicles'">
          <button @click="vehicleAction('respawn', r.id)" class="btn-heal">Respawn</button>
          <button @click="vehicleAction('delete', r.id)" class="btn-delete">Delete</button>
        </td>
      </tr>
    </table>
    <p v-if="active!=='map' && !rows.length">Нет данных</p>
  </div>
</div>

<script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="app.js"></script>
</body>
</html>
